<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角方形 -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- 代码括号 </> -->
  <g transform="translate(256, 256)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左括号 < -->
    <path d="M -100 -60 L -170 0 L -100 60" />
    <!-- 右括号 > -->
    <path d="M 100 -60 L 170 0 L 100 60" />
    <!-- 中间斜杠 /，代表团队连接 -->
    <line x1="20" y1="-80" x2="-20" y2="80" stroke-width="24" />
  </g>
  <!-- 底部三个点，代表团队成员 -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="196" cy="380" r="14"/>
    <circle cx="256" cy="380" r="14"/>
    <circle cx="316" cy="380" r="14"/>
  </g>
</svg>
