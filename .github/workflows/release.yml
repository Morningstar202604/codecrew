name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64, suffix: linux-amd64}
          - {goos: linux, goarch: arm64, suffix: linux-arm64}
          - {goos: darwin, goarch: amd64, suffix: darwin-amd64}
          - {goos: darwin, goarch: arm64, suffix: darwin-arm64}
          - {goos: windows, goarch: amd64, suffix: windows-amd64, ext: .exe}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="codecrew-${{ matrix.suffix }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${bin}" ./cmd/codecrew
          cp LICENSE README.md "dist/" 2>/dev/null || true
          if [ "${{ matrix.ext }}" = "" ]; then
            tar -czf "dist/codecrew-${{ matrix.suffix }}.tar.gz" -C dist "${bin}"
          else
            (cd dist && zip -qr "codecrew-${{ matrix.suffix }}.zip" "${bin}")
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/codecrew-${{ matrix.suffix }}.tar.gz
            dist/codecrew-${{ matrix.suffix }}.zip
